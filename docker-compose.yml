services:
  webadmin:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/municipall-webadmin:latest
    container_name: municipall-webadmin
    restart: always
    ports:
      - "5000:3000"
    environment:
      - PLATFORM_ADMIN_KEY=${PLATFORM_ADMIN_KEY}
    networks:
      - proxy-bridge

networks:
  proxy-bridge:
    external: true
    name: municipall_default
